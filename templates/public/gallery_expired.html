<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Link no longer available — Denspark Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; background: #fafafa; color: #1a1a1a; padding: 20px;
    }
    .exp-card {
      max-width: 420px; text-align: center; background: #fff; border: 1px solid #eee;
      border-radius: 14px; padding: 44px 32px;
    }
    .exp-logo { font-size: 19px; font-weight: 700; margin-bottom: 22px; }
    .exp-logo .accent { color: #1d6f56; }
    .exp-icon {
      width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 50%; background: #fdeeea;
      display: flex; align-items: center; justify-content: center;
    }
    .exp-title { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
    .exp-text { font-size: 14px; color: #777; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="exp-card">
    <div class="exp-logo">Denspark<span class="accent">Studio</span></div>
    <div class="exp-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b3462c" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <p class="exp-title">This link is no longer available</p>
    <p class="exp-text">It may have expired or been removed. Please contact Denspark Studio for a new link.</p>
  </div>
</body>
</html>
